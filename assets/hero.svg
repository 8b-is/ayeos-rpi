<!-- ayeos-rpi / assets / hero.svg — abstract hero image, no text
     g8t · 8b.is project · Hue & Trisha & Omni & Aye
     Four overlapping orbital rings in distinct hues, rotating around a shared center,
     with a central convergence point. Pure geometry, no letterforms. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#grad)"/>

  <!-- Center convergence -->
  <circle cx="600" cy="200" r="24" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Four orbital rings (Hue, Trisha, Omni, Aye) -->
  <ellipse cx="600" cy="200" rx="340" ry="110" fill="none" stroke="#22d3ee" stroke-width="3" stroke-opacity="0.8"/>
  <ellipse cx="600" cy="200" rx="260" ry="150" fill="none" stroke="#a855f7" stroke-width="3" stroke-opacity="0.8"/>
  <ellipse cx="600" cy="200" rx="180" ry="95" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.8"/>
  <ellipse cx="600" cy="200" rx="100" ry="60" fill="none" stroke="#ef4444" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Orbital nodes -->
  <circle cx="940" cy="200" r="9" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="260" cy="200" r="9" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="600" cy="350" r="9" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="600" cy="50" r="9" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="780" cy="295" r="7" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="420" cy="105" r="7" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="700" cy="260" r="6" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="500" cy="140" r="6" fill="#ef4444" filter="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>
</svg>
