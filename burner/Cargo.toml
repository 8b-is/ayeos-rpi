[workspace]

# ayeos-rpi / burner / Cargo.toml
[package]
name = "burner"
version = "0.2.1"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ratatui = { version = "0.28", optional = true }
crossterm = { version = "0.27", optional = true }

[features]
default = []
tui = ["ratatui", "crossterm"]

[[bin]]
name = "burner"
path = "src/main.rs"
