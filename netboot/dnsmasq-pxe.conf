# ayeos-rpi v0.1 PoC — dnsmasq proxyDHCP + TFTP config for Pi 4B coordinator (node-0)
# Usage on Pi 4B Linux coordinator:
#   sudo dnsmasq --no-daemon --conf-file=/etc/dnsmasq.d/ayeos-pxe.conf
#
# Uses proxyDHCP so it coexists safely with your existing router/DHCP server.
# To act as standalone DHCP server on an isolated switch, replace the proxy line with:
#   dhcp-range=192.168.50.100,192.168.50.199,255.255.255.0,1h

interface=eth0
bind-interfaces
port=0

# ProxyDHCP on local LAN (update subnet to match eth0)
dhcp-range=192.168.1.0,proxy,255.255.255.0
pxe-service=0,"Raspberry Pi Boot"

# TFTP server serving kernel8.img / vmlinuz, config.txt, cmdline.txt, initramfs.cpio.zst
enable-tftp
tftp-root=/srv/tftp
# Per-board serial subdirectories (e.g. /srv/tftp/<serial>/config.txt) fallback cleanly to tftp-root
tftp-unique-root=mac

# Pi 3B note: place VideoCore bootcode.bin on a tiny FAT32 SD card if OTP bit 17 is not set,
# or boot from /srv/tftp/bootcode.bin if program_usb_boot_mode=1 was enabled.
log-dhcp
log-facility=-
