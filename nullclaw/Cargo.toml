[workspace]

# ayeos-rpi / nullclaw / Cargo.toml
[package]
name = "nullclaw"
version = "0.2.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "signal", "time"] }
shellexpand = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "nullclaw"
path = "src/main.rs"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
