[workspace]

# ayeos-rpi / nullclaw / Cargo.toml
[package]
name = "nullclaw"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
shellexpand = "3"

[[bin]]
name = "nullclaw"
path = "src/main.rs"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]

[profile.release]
opt-level = 3
lto = true
