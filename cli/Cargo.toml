[workspace]

# ayeos-rpi / cli / Cargo.toml — Sovereign MacBook USB-Dongle Mesh Launcher & Burner CLI
[package]
name = "ayeos-cli"
version = "0.2.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"

[[bin]]
name = "ayeos"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
